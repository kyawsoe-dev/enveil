name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf



      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend
        working-directory: desktop
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Build Tauri app
        working-directory: src-tauri
        run: tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enveil-linux
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend
        working-directory: desktop
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Build Tauri app
        working-directory: src-tauri
        run: tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enveil-windows
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  build-mac-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend
        working-directory: desktop
        run: npm ci && npm run build

      - name: Verify icon files
        working-directory: src-tauri
        run: ls -la icons/

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Build Tauri app
        working-directory: src-tauri
        run: tauri build --target x86_64-apple-darwin --bundles dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enveil-mac-intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/**/*
          if-no-files-found: error

  build-mac-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend
        working-directory: desktop
        run: npm ci && npm run build

      - name: Verify icon files
        working-directory: src-tauri
        run: ls -la icons/

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Build Tauri app
        working-directory: src-tauri
        run: tauri build --bundles dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enveil-mac-silicon
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  create-release:
    needs: [build-linux, build-windows, build-mac-intel, build-mac-silicon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "release for v0.1.0"
          generate_release_notes: true
          draft: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
