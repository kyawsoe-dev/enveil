name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf



      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend
        working-directory: desktop
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Build Tauri app
        working-directory: src-tauri
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          python3 -c "import os; open('/tmp/tauri-key.pem','w').write(os.environ['TAURI_PRIVATE_KEY'].strip())"
          TAURI_PRIVATE_KEY=/tmp/tauri-key.pem tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enveil-linux
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend
        working-directory: desktop
        run: npm ci && npm run build

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Build Tauri app
        working-directory: src-tauri
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          python3 -c "import os; open('C:\\tauri-key.pem','w').write(os.environ['TAURI_PRIVATE_KEY'].strip())"
          $env:TAURI_PRIVATE_KEY = 'C:\tauri-key.pem'
          tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enveil-windows
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  build-mac-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend
        working-directory: desktop
        run: npm ci && npm run build

      - name: Verify icon files
        working-directory: src-tauri
        run: ls -la icons/

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Build Tauri app
        working-directory: src-tauri
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          python3 -c "import os; open('/tmp/tauri-key.pem','w').write(os.environ['TAURI_PRIVATE_KEY'].strip())"
          TAURI_PRIVATE_KEY=/tmp/tauri-key.pem tauri build --target x86_64-apple-darwin --bundles dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enveil-mac-intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/**/*
          if-no-files-found: error

  build-mac-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend
        working-directory: desktop
        run: npm ci && npm run build

      - name: Verify icon files
        working-directory: src-tauri
        run: ls -la icons/

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Build Tauri app
        working-directory: src-tauri
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          python3 -c "import os; open('/tmp/tauri-key.pem','w').write(os.environ['TAURI_PRIVATE_KEY'].strip())"
          TAURI_PRIVATE_KEY=/tmp/tauri-key.pem tauri build --bundles dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enveil-mac-silicon
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  create-release:
    needs: [build-linux, build-windows, build-mac-intel, build-mac-silicon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f | head -30

      - name: Generate updater JSON
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          echo "$TAURI_PRIVATE_KEY" > /tmp/tauri-key.pem
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # Sign each platform artifact and derive URL from actual filename
          sign_and_url() {
            local file="$1"
            if [ -f "$file" ]; then
              local filename=$(basename "$file")
              tauri signer sign --private-key "$(cat /tmp/tauri-key.pem)" --password "$TAURI_KEY_PASSWORD" "$file" > /dev/null 2>&1
              local sig=$(cat "$file.sig" 2>/dev/null)
              if [ -z "$sig" ]; then
                echo "null"
                return
              fi
              echo "{\"signature\": \"$sig\", \"url\": \"https://github.com/${{ github.repository }}/releases/download/$TAG/$filename\"}"
            else
              echo "null"
            fi
          }

          DMG_X64=$(sign_and_url "$(find artifacts -name '*x64*.dmg' ! -name '*aarch64*' | head -1)")
          DMG_AARCH64=$(sign_and_url "$(find artifacts -name '*aarch64*.dmg' | head -1)")
          MSI=$(sign_and_url "$(find artifacts -name '*.msi' | head -1)")
          DEB=$(sign_and_url "$(find artifacts -name '*.deb' | head -1)")

          cat > artifacts/updater.json <<EOF
          {
            "version": "$VERSION",
            "notes": "See https://github.com/${{ github.repository }}/releases/tag/$TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-x86_64": $DMG_X64,
              "darwin-aarch64": $DMG_AARCH64,
              "windows-x86_64": $MSI,
              "linux-x86_64": $DEB
            }
          }
          EOF
          echo "updater.json:"
          cat artifacts/updater.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "release for ${{ github.ref_name }}"
          generate_release_notes: true
          draft: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/updater.json
