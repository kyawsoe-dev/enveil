[package]
name = "env-vault"
version = "0.1.0"
description = "A centralized environment variable and secret management platform for developers. Securely store, encrypt, compare, search, and inject project secrets across multiple applications from a single dashboard."
authors = ["Kyaw Soe"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["dialog-save", "fs-all", "path-all", "shell-all", "updater"] }
time = ">=0.3.35, <0.3.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
directories = "5"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
rand = "0.8"
mdns-sd = "0.12"
tokio = { version = "1", features = ["net", "io-util", "macros", "sync"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
