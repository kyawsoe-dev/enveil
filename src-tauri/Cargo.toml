[package]
name = "env-vault"
version = "0.1.4"
description = "A centralized environment variable and secret management platform for developers. Securely store, encrypt, compare, search, duplicate projects, and inject secrets across multiple applications. Share projects with team members on the same network via LAN sync with per-project share passwords for download authorization."
authors = ["Kyaw Soe"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "fs-all", "clipboard-write-text", "dialog-open", "dialog-save", "shell-open", "updater"] }
time = ">=0.3.35, <0.3.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
directories = "5"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
rand = "0.8"
mdns-sd = "0.13"
tokio = { version = "1", features = ["net", "io-util", "macros", "sync"] }
notify = { version = "8", features = ["macos_kqueue"] }
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
